# ovpnmux configuration. ${VAR} is expanded from the environment.
listen: 0.0.0.0:1080          # SOCKS5 + HTTP proxy (restrict with compose `ports:`)
admin_listen: 0.0.0.0:9090    # GET /status, GET /healthz, POST /tunnels/{id}/reconnect

auth:
  required: true
  password: ${OVPNMUX_PASSWORD}   # SOCKS5 / Proxy-Authorization password; the username selects the exit

profiles_dir: /profiles       # every *.ovpn below this directory is a candidate (compose mounts ./profiles)

pool:
  size: 4                     # tunnels kept up at the same time
  per_country:                # optional: reserve slots for countries (uses `# tags: country=XX`)
    JP: 2

selection:
  default: sticky             # rr | sticky (same client IP + key stays on one tunnel)
  sticky_ttl: 10m

# extra_listeners:            # optional ports with a fixed selection, for clients without username support
#   - { listen: 0.0.0.0:1081, select: jp }

routing:
  table_base: 100             # tunnel N uses routing table and fwmark table_base+N
  fallback_dns: [1.1.1.1, 8.8.8.8]

health:
  url: http://www.gstatic.com/generate_204
  geo_url: http://ip-api.com/json/?fields=status,countryCode,query   # "" disables exit IP / country lookup
  interval: 30s
  cooldown: 15m               # how long a failed profile is left alone

openvpn_bin: openvpn
data_dir: /var/lib/ovpnmux
