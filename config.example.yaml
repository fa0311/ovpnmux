listen: 0.0.0.0:1080          # HTTP CONNECT proxy. Basic auth username = profile file name (without .ovpn)
admin_listen: 0.0.0.0:9090    # GET /status, GET /healthz
password: change-me           # Basic auth password; empty accepts any password
profiles_dir: /profiles       # one tunnel per *.ovpn below this directory
health_url: http://www.gstatic.com/generate_204
health_interval: 30s          # 3 failures in a row -> reconnect
retry_interval: 1m            # wait before reconnecting after a failure
fallback_dns: [1.1.1.1, 8.8.8.8]   # used when the server pushes no DNS
table_base: 100               # tunnel N uses routing table and fwmark table_base+N
openvpn_bin: openvpn
data_dir: /var/lib/ovpnmux
